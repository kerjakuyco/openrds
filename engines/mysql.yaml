services:
  db:
    image: mysql:8.4
    command: ["mysqld"]
    restart: unless-stopped
    cpus: ${OPENRDS_DB_CPUS:-0}
    mem_limit: ${OPENRDS_DB_MEMORY:-0}
    labels:
      io.openrds.database: "true"
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: openrds
      MYSQL_PASSWORD: ${OPENRDS_DB_PASSWORD:?missing database password}
      MYSQL_ROOT_PASSWORD: ${OPENRDS_ROOT_PASSWORD:?missing root password}
    ports:
      - "127.0.0.1:${OPENRDS_DB_PORT:?missing host port}:3306"
    volumes:
      - data:/var/lib/mysql
    secrets:
      - { source: tls_cert, target: /run/openrds/server.crt, uid: "999", gid: "999", mode: 0444 }
      - { source: tls_key, target: /run/openrds/server.key, uid: "999", gid: "999", mode: 0400 }
      - { source: tls_ca, target: /run/openrds/ca.crt, mode: 0444 }
    networks:
      default:
        aliases: ["${OPENRDS_DB_ALIAS:?missing instance alias}"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql --protocol=tcp -h 127.0.0.1 -u root -D app -Nse 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:

# Files OpenRDS generates, copied into the container by Compose.
secrets:
  tls_cert:
    environment: OPENRDS_TLS_CERT
  tls_key:
    environment: OPENRDS_TLS_KEY
  tls_ca:
    environment: OPENRDS_TLS_CA
