services:
  db:
    image: ${OPENRDS_DB_IMAGE:?missing image}
    command: ["postgres"]
    restart: unless-stopped
    # Time to finish writes and flush caches before Docker kills the server,
    # also when the host shuts down. OpenRDS's own stops wait as long.
    stop_grace_period: 2m
    cpus: ${OPENRDS_DB_CPUS:-0}
    mem_limit: ${OPENRDS_DB_MEMORY:-0}
    # Parallel queries share memory through /dev/shm. Docker's 64 MB default
    # fails them on large tables; pages used still count against mem_limit.
    shm_size: ${OPENRDS_DB_SHM:-1073741824}
    labels:
      io.openrds.database: "true"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: openrds
      POSTGRES_PASSWORD: ${OPENRDS_DB_PASSWORD:?missing database password}
    ports:
      - "127.0.0.1:${OPENRDS_DB_PORT:?missing host port}:5432"
    volumes:
      - data:${OPENRDS_DATA_MOUNT:-/var/lib/postgresql/data}
    secrets:
      - { source: tls_cert, target: /run/openrds/server.crt, uid: "70", gid: "70", mode: 0444 }
      - { source: tls_key, target: /run/openrds/server.key, uid: "70", gid: "70", mode: 0400 }
      - { source: tls_ca, target: /run/openrds/ca.crt, mode: 0444 }
      - { source: pg_hba, target: /run/openrds/pg_hba.conf, uid: "70", gid: "70", mode: 0400 }
    networks:
      default:
        aliases: ["${OPENRDS_DB_ALIAS:?missing instance alias}"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "openrds", "-d", "app"]
      interval: 5s
      timeout: 3s
      retries: 20
      # Crash recovery after a power loss can take minutes; checks run every
      # 2s meanwhile, so a normal start still turns healthy at once.
      start_period: 10m
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:

# Files OpenRDS generates, copied into the container by Compose.
secrets:
  tls_cert:
    environment: OPENRDS_TLS_CERT
  tls_key:
    environment: OPENRDS_TLS_KEY
  tls_ca:
    environment: OPENRDS_TLS_CA
  pg_hba:
    environment: OPENRDS_PG_HBA
