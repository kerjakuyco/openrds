name: Feature request
description: Suggest an idea or improvement for OpenRDS.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please search [existing issues](https://github.com/kerjakuyco/openrds/issues) first; if someone already asked, add a 👍 to it instead.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way.
      placeholder: I want to restore my database to how it was an hour ago, but backups only run once a day.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: How you imagine it working, in the console or the API.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds you use today, or how other tools handle it.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to help build this.
