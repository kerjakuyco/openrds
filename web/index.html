<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f0ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <title>OpenRDS · Database control plane</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <noscript>Enable JavaScript to use the OpenRDS dashboard, or use the authenticated HTTP API.</noscript>
  <div id="boot" class="boot">Connecting to OpenRDS…</div>

  <main id="login" class="login-screen" hidden>
    <div class="login-wrap">
      <section class="login-intro" aria-label="About OpenRDS">
        <div class="brand"><svg class="mark" aria-hidden="true"><use href="/icons.svg#mark"/></svg>OpenRDS</div>
        <div id="auth-intro" class="intro-body"></div>
        <p class="intro-foot">Self-hosted. Your data stays on this server.</p>
      </section>
      <div class="login-card">
        <div id="auth-panel"></div>
      </div>
    </div>
  </main>

  <div id="app" class="shell" hidden>
    <a class="skip" href="#content">Skip to content</a>
    <aside class="sidebar" id="sidebar" aria-label="OpenRDS">
      <div class="sidebar-top">
        <a class="brand" href="#/" title="OpenRDS dashboard"><svg class="mark" aria-hidden="true"><use href="/icons.svg#mark"/></svg><span class="label">OpenRDS</span></a>
        <button id="collapse" class="icon-btn rail-btn desktop-only" type="button" aria-pressed="false" aria-label="Collapse the sidebar"><svg class="icon" aria-hidden="true"><use href="/icons.svg#sidebar"/></svg></button>
        <button id="nav-close" class="icon-btn rail-btn mobile-only" type="button" aria-label="Close navigation"><svg class="icon" aria-hidden="true"><use href="/icons.svg#close"/></svg></button>
      </div>
      <a id="nav-create" class="btn primary nav-create" href="#/databases/new" title="Create database" hidden><svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"/></svg><span class="label">Create database</span></a>
      <button id="jump" class="jump" type="button" title="Jump to… (Ctrl K)" aria-keyshortcuts="Control+K Meta+K"><svg class="icon" aria-hidden="true"><use href="/icons.svg#search"/></svg><span class="label">Jump to…</span><kbd class="label" id="jump-key">Ctrl K</kbd></button>
      <nav id="nav" aria-label="Main">
        <div class="nav-group nav-main">
          <a href="#/" data-nav="dashboard" title="Dashboard"><svg class="icon" aria-hidden="true"><use href="/icons.svg#overview"/></svg><span class="label">Dashboard</span></a>
          <a href="#/databases" data-nav="databases" title="Databases"><svg class="icon" aria-hidden="true"><use href="/icons.svg#db"/></svg><span class="label">Databases</span><span id="db-count" class="nav-count"></span></a>
          <a href="#/servers" data-nav="servers" title="Servers"><svg class="icon" aria-hidden="true"><use href="/icons.svg#host"/></svg><span class="label">Servers</span><span id="server-count" class="nav-count"></span></a>
          <a href="#/backups" data-nav="backups" title="Backups"><svg class="icon" aria-hidden="true"><use href="/icons.svg#archive"/></svg><span class="label">Backups</span></a>
          <a href="#/events" data-nav="events" title="Events"><svg class="icon" aria-hidden="true"><use href="/icons.svg#bell"/></svg><span class="label">Events</span><span id="events-badge" class="nav-badge warn" hidden></span></a>
        </div>
        <section class="nav-group nav-dbs-group" data-group="dbs" id="nav-dbs-group" hidden>
          <button class="nav-label" type="button" aria-expanded="true" aria-controls="nav-dbs"><span class="label">Needs attention</span><svg class="icon chevron" aria-hidden="true"><use href="/icons.svg#chevron"/></svg></button>
          <div id="nav-dbs" class="nav-items nav-dbs"></div>
        </section>
        <section class="nav-group" data-group="settings">
          <button class="nav-label" type="button" aria-expanded="true" aria-controls="nav-settings"><span class="label">Settings</span><svg class="icon chevron" aria-hidden="true"><use href="/icons.svg#chevron"/></svg></button>
          <div id="nav-settings" class="nav-items">
            <a href="#/backup-storage" data-nav="storage" title="Backup storage"><svg class="icon" aria-hidden="true"><use href="/icons.svg#cloud"/></svg><span class="label">Backup storage</span></a>
            <a href="#/users" data-nav="users" class="admin-only" title="Users" hidden><svg class="icon" aria-hidden="true"><use href="/icons.svg#users"/></svg><span class="label">Users</span></a>
            <a href="#/notifications" data-nav="notifications" class="admin-only" title="Notifications" hidden><svg class="icon" aria-hidden="true"><use href="/icons.svg#alert"/></svg><span class="label">Notifications</span></a>
          </div>
        </section>
      </nav>
      <div class="side-foot">
        <a id="nav-start" class="start-card" href="#/getting-started" data-nav="start" title="Getting started" hidden>
          <span class="start-card-head"><svg class="icon" aria-hidden="true"><use href="/icons.svg#spark"/></svg><span class="label">Getting started</span><span id="start-badge" class="nav-count"></span></span>
          <span class="start-bar label" aria-hidden="true"><span id="start-fill"></span></span>
        </a>
        <a class="side-link" href="https://github.com/kerjakuyco/openrds#readme" target="_blank" rel="noopener noreferrer" title="Documentation (opens in a new tab)"><svg class="icon" aria-hidden="true"><use href="/icons.svg#book"/></svg><span class="label">Documentation</span></a>
        <div id="account" class="account"></div>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-start">
          <button id="menu-toggle" class="icon-btn mobile-only" type="button" aria-expanded="false" aria-controls="sidebar" aria-label="Open navigation"><svg class="icon" aria-hidden="true"><use href="/icons.svg#list"/></svg></button>
          <nav id="crumbs" class="crumbs" aria-label="Breadcrumb"></nav>
        </div>
        <div class="top-actions">
          <span id="ops" class="ops" role="status" hidden></span>
          <span id="link-state" class="link-state" role="status" title=""><span class="dot"></span><span id="host-name">Connecting</span></span>
          <button id="refresh" class="icon-btn" type="button" title="Refresh" aria-label="Refresh"><svg class="icon" aria-hidden="true"><use href="/icons.svg#refresh"/></svg></button>
        </div>
      </header>
      <div id="sync-error" class="alert warn page-alert" role="status" hidden></div>
      <main id="content" tabindex="-1"></main>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
