name: openrds
services:
  openrds:
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${OPENRDS_PORT:-8080}:8080"
    environment:
      OPENRDS_DISK_HELPER_IMAGE: openrds-disk-helper:local
      OPENRDS_METRICS_INTERVAL: ${OPENRDS_METRICS_INTERVAL:-30s}
      OPENRDS_PUBLIC_PORT: ${OPENRDS_PORT:-8080}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - control:/var/lib/openrds
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  disk-helper:
    profiles: ["helper"]
    build:
      context: .
      target: disk-helper
    image: openrds-disk-helper:local

volumes:
  control:
